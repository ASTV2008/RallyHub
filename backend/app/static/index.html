<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RallyHub</title>
<link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<div class="shell">
  <aside class="side" id="side" aria-label="Navegación principal">
    <div class="brand"><img src="/static/assets/logo.svg" alt=""><span>RallyHub</span></div>
    <nav><ul class="nav" id="nav"></ul></nav>
  </aside>
  <div class="main-col">
    <header class="top">
      <button class="btn sm menu-btn" id="menu" aria-controls="side" aria-expanded="false">☰ Menú</button>
      <div class="spacer"></div>
      <div class="who" id="who"></div>
      <button class="btn sm" id="logout">Cerrar sesión</button>
    </header>
    <main id="main" tabindex="-1">
      <div class="crumbs" id="crumbs"></div>
      <h1 id="title">Cargando…</h1>
      <div id="view"><div class="skeleton"></div><div class="skeleton"></div></div>
    </main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
