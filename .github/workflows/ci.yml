# CI (integración continua): verifica calidad en cada push/PR. NO despliega ni publica imágenes (eso sería CD).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4.5
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: rallyhub_test
          MARIADB_USER: rallyhub
          MARIADB_PASSWORD: ci-db-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-ci-only-secret-key-0123
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: rallyhub_test
      DB_USER: rallyhub
      DB_PASSWORD: ci-db-password
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias fijadas
        run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check . ../scripts
      - name: Migraciones desde base vacía
        run: alembic upgrade head
      - name: Pruebas (unitarias + integración) con cobertura
        run: pytest -ra --cov=app --cov-report=term-missing --cov-report=xml
      - name: Resumen en el job
        if: always()
        run: |
          echo "### Resultado de pruebas" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          if os.path.exists("coverage.xml"):
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate", 0))
              print(f"Cobertura de líneas: {rate:.1%}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore
